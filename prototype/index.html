<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusShare – UI Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div class="proto-banner">
    Initial UI prototype &middot; sample data only &middot; no backend, login, or database &middot; actions are simulated in the browser
  </div>

  <nav class="navbar navbar-expand-md app-nav sticky-top">
    <div class="container">
      <a class="navbar-brand brand" href="#/dashboard"><span class="brand-dot">C</span>CampusShare</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto gap-md-1 mt-2 mt-md-0">
          <li class="nav-item"><a class="nav-link" data-route="dashboard" href="#/dashboard">Home</a></li>
          <li class="nav-item"><a class="nav-link" data-route="browse" href="#/browse">Browse</a></li>
          <li class="nav-item"><a class="nav-link" data-route="requests" href="#/requests">Requests <span class="badge rounded-pill text-bg-danger" id="reqBadge"></span></a></li>
          <li class="nav-item"><a class="nav-link" data-route="activity" href="#/activity">My Activity</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2 mt-2 mt-md-0">
          <a class="btn btn-brand btn-sm" href="#/new">+ List an item</a>
          <span class="avatar" id="navAvatar" title="Simulated signed-in student"></span>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="app" aria-live="polite"></main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center border-0" role="status">
      <div class="d-flex">
        <div class="toast-body" id="toastBody"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <footer class="container py-4 small text-muted">
    CampusShare &middot; Capstone project prototype &middot; The Spring Boot + MySQL backend is planned for later development.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
